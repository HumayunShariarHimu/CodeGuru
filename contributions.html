<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeGuru Contributions</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" rel="stylesheet">
  </head>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }
    
    ul li {
      list-style: none;
      float: left;
    }
    
    li div.contributions {
      width: 50px;
      height: 50px;
      float: left;
      background-color: #EBEFF0;
      font-weight: bold;
      text-align: center;
      vertical-align: middle;
      line-height: 50px;  
    }
    
    div.identity {
      float: left;
      background-color: #ECF0EB;
      height: 50px;
      padding-right: 5px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    
    div.identity-left{
      float: left;
    }
    
    div.identity-right{
      float: right;
      margin-left: 5px;
      margin-top: 5px;
    }
    
    span {
      display: block;
    }
    
    span.name {
      font-size: 1.3em;
    }  
  </style> 
  <body>
    <div id="container">
      <ul></ul>
      <div style="clear: both;"></div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script>
      $(document).ready(function() {
        var owner = "HumayunShariarHimu";
        var ownerName = "Humayun Shariar Himu";
        var repoNames = new Set(["CodeGuru", "machine-learning", "git", "sql", "shell", "qt", "scala", "python-programming", "java", "ruby", "laravel", "php", "minima", "javascript", "ios", "go", "data-science", "deep-learning", "django", "clojure", "bangla-programming-resources", "blog", "arduino", "c"]);

        function getUrlParameter(name) {
          var params = new URLSearchParams(window.location.search);
          return params.get(name);
        }

        function renderMaintainer(contributions) {
          var countText = (typeof contributions === "number") ? String(contributions) : "—";
          var $item = $("<li>").attr("id", "humayun-shariar-himu");
          var $count = $("<div>").addClass("contributions").attr("aria-label", "Contribution count").text(countText);
          var $identity = $("<div>").addClass("identity");
          var $left = $("<div>").addClass("identity-left");
          var $right = $("<div>").addClass("identity-right");
          var $image = $("<img>").attr({src: "https://github.com/HumayunShariarHimu.png", alt: ownerName, height: 50, width: 50});
          var $name = $("<span>").addClass("name").append($("<a>").attr({href: "https://github.com/HumayunShariarHimu", rel: "noopener"}).text(ownerName));
          var $role = $("<span>").addClass("web").text("CodeGuru রক্ষণাবেক্ষণকারী");
          $left.append($image);
          $right.append($name, $role);
          $identity.append($left, $right);
          $item.append($count, $identity);
          $("#container ul").empty().append($item);
        }

        var requested = getUrlParameter("repo") || "CodeGuru";
        var repo = repoNames.has(requested) ? requested : "CodeGuru";
        $.ajax({
          url: "https://api.github.com/repos/" + owner + "/" + encodeURIComponent(repo) + "/contributors?per_page=100",
          type: "GET",
          cache: false,
          success: function(response) {
            var match = (response || []).find(function(item) {
              return (item.login || "").toLowerCase() === owner.toLowerCase();
            });
            renderMaintainer(match && typeof match.contributions === "number" ? match.contributions : null);
          },
          error: function() { renderMaintainer(null); }
        });
      });
    </script>
  </body>
</html>
